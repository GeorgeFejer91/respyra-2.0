[project]
name = "mpi"
version = "0.1.0"
description = "Breathing-belt visual-feedback validation study"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "psychopy>=2026.2.1",
    "respyra>=0.4.0",
    "pylsl>=1.18.5",
    "numpy>=2.2.6",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"mpi.event_markers" = ["catalog.json"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyxdf==1.17.5",
]
notebooks = [
    "jupyter==1.1.*",
    "ipympl>=0.10.0",
]

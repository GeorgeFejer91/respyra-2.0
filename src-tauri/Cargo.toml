[package]
name = "respyra-desktop"
version = "0.3.4"
edition = "2024"
description = "HTML setup shell for the PsychoPy Respyra experiment"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3.4"
rfd = "0.17.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
